<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — LaundryPro</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/laundrypro.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="text-center p-4" style="max-width: 480px;">
        <div class="mb-3">
            <span class="rounded-circle bg-warning-subtle text-warning p-3 d-inline-flex">
                <i class="bi bi-wifi-off fs-1"></i>
            </span>
        </div>
        <h4 class="fw-bold mb-2">Anda Sedang Offline</h4>
        <p class="text-muted mb-4">
            Koneksi internet Anda terputus. Untuk menjaga validitas dan integritas transaksi finansial, pembuatan nota, dan mutasi stok, sistem memerlukan koneksi server aktif.
        </p>
        <button onclick="window.location.reload()" class="btn btn-primary px-4">
            <i class="bi bi-arrow-clockwise me-1"></i> Coba Sambungkan Kembali
        </button>
    </div>
</body>
</html>
